# BEGIN ICB canonical storefront restoration
<IfModule mod_setenvif.c>
SetEnvIfNoCase Host "^(anterior|tienda)\.icbtechscr\.com(:[0-9]+)?$" ICB_RETIRED_HOST
</IfModule>
<IfModule mod_headers.c>
Header always set Cache-Control "no-store, max-age=0" env=ICB_RETIRED_HOST
</IfModule>
<IfModule mod_rewrite.c>
RewriteEngine On
# Compatibility for cached redirects: these hosts no longer show a website.
RewriteCond %{HTTP_HOST} ^(anterior|tienda)\.icbtechscr\.com(:[0-9]+)?$ [NC]
RewriteRule ^ https://icbtechscr.com%{REQUEST_URI}?icb_actual=20261116 [R=302,L,NE,QSA]
# Old-IP HTTP clients also finish on the original HTTPS domain.
RewriteCond %{HTTP_HOST} ^(www\.)?icbtechscr\.com(:[0-9]+)?$ [NC]
RewriteCond %{HTTPS} !=on
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/ [NC]
RewriteRule ^ https://icbtechscr.com%{REQUEST_URI}?icb_actual=20261116 [R=307,L,NE,QSA]
# Retain the visible domain while DNS caches expire; never load WordPress.
RewriteCond %{HTTP_HOST} ^(www\.)?icbtechscr\.com(:[0-9]+)?$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/ [NC]
RewriteRule ^ _icb_current_site_bridge.php [END]
</IfModule>
# END ICB canonical storefront restoration
