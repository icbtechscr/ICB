# BEGIN ICB legacy DNS transition
<IfModule mod_setenvif.c>
SetEnvIfNoCase Host "^(www\.)?icbtechscr\.com(:[0-9]+)?$" ICB_TRANSITION
</IfModule>
<IfModule mod_headers.c>
Header always set Cache-Control "no-store, max-age=0" env=ICB_TRANSITION
</IfModule>
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{HTTP_HOST} ^(www\.)?icbtechscr\.com(:[0-9]+)?$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/ [NC]
RewriteRule ^ https://tienda.icbtechscr.com%{REQUEST_URI} [R=302,L,NE]
</IfModule>
# END ICB legacy DNS transition
